# Python application CI
# Fixed 2026-10-02: Node deprecation, flake8 false fails, empty pytest

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Fail only on real syntax / undefined-name errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
          --exclude=.git,__pycache__,.venv,venv,node_modules,expo-app,react-app,docs,showcase,archive
        # Style report (never fails the job)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics \
          --exclude=.git,__pycache__,.venv,venv,node_modules,expo-app,react-app,docs,showcase,archive

    - name: Test with pytest
      run: |
        # Succeed even when no tests are collected yet
        pytest --tb=short || test $? -eq 5
